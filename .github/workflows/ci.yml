name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - ci/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Show flake metadata
        run: nix flake metadata --accept-flake-config

      - name: Run project CI
        run: nix develop --accept-flake-config --command bash scripts/ci.sh
