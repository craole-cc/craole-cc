name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Keep debug/test artifacts small on GitHub's finite-disk hosted runner.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTFLAGS: -Cdebuginfo=0
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Show flake metadata
        run: nix flake metadata --accept-flake-config

      - name: Run project CI
        run: nix develop --accept-flake-config --command bash scripts/ci.sh

  deploy:
    name: Deploy production
    needs: rust
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, theoracle]
    timeout-minutes: 30
    environment:
      name: production
      url: https://craole.cc/
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Repair runner workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -un):$(id -gn)" "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production release
        run: /nix/var/nix/profiles/default/bin/nix develop --accept-flake-config --command bash -lc 'cargo leptos build --release'

      - name: Export static fallback
        run: /nix/var/nix/profiles/default/bin/nix develop --accept-flake-config --command bash -lc 'cargo run -p contentctl -- export-static . .deploy-static'

      - name: Deploy and verify locally
        run: sudo /usr/local/sbin/craole-cc-deploy

      - name: Verify public HTTPS endpoints
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://craole.cc/ >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://craole.cc/dev >/dev/null
